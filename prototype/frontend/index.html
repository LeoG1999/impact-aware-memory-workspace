<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Memory Impact Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">MI</div>
          <div>
            <h1>Memory Impact Lab</h1>
            <p>京都三日行程 · 反事实记忆预演</p>
          </div>
        </div>
        <div class="topbar-actions">
          <div id="apiStatus" class="api-status" role="status">
            <span class="status-dot"></span>
            <span>正在检查 DeepSeek</span>
          </div>
          <button id="resetButton" class="button button-secondary" type="button">重置</button>
          <button id="generateButton" class="button button-primary" type="button">生成初始行程</button>
        </div>
      </header>

      <section class="brief-band" aria-labelledby="briefTitle">
        <div class="brief-copy">
          <span class="section-label">当前请求</span>
          <h2 id="briefTitle">去京都旅行三天，希望兼顾当地文化、轻松节奏与素食饮食。</h2>
        </div>
        <label class="request-field" for="tripRequest">
          <span>补充要求</span>
          <textarea id="tripRequest" rows="2">请安排 3 天京都行程，不要太赶，预算约 700 美元，不包含国际机票。</textarea>
        </label>
      </section>

      <main class="workspace">
        <aside class="memory-pane" aria-labelledby="memoryTitle">
          <div class="pane-heading">
            <div>
              <span class="section-label">持久记忆</span>
              <h2 id="memoryTitle">Memory</h2>
            </div>
            <span id="memoryCount" class="count-badge"></span>
          </div>
          <div id="memoryList" class="memory-list"></div>
          <section id="memoryEditor" class="memory-editor" aria-live="polite"></section>
        </aside>

        <section class="plan-pane" aria-labelledby="planTitle">
          <div class="pane-heading plan-heading">
            <div>
              <span class="section-label">Agent 输出</span>
              <h2 id="planTitle">行程方案</h2>
            </div>
            <div id="planMeta" class="plan-meta"></div>
          </div>
          <div id="planSurface" class="plan-surface"></div>
        </section>

        <aside class="impact-pane" aria-labelledby="impactTitle">
          <div class="pane-heading">
            <div>
              <span class="section-label">Sandbox 对比</span>
              <h2 id="impactTitle">Impact Map</h2>
            </div>
            <span id="impactBadge" class="count-badge">待预演</span>
          </div>
          <div id="impactSurface" class="impact-surface"></div>
        </aside>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
