# Mount the research prototype under:
# https://minou.online/meeting-memory-governance/
#
# Upstream service expected:
# 127.0.0.1:3087 with BASE_PATH=/meeting-memory-governance

location = /meeting-memory-governance {
    return 301 /meeting-memory-governance/;
}

location ^~ /meeting-memory-governance/ {
    proxy_pass http://127.0.0.1:3087;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}
